<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Train the Dog | AIRIS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-page">

        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                airis
            </div>

            <div class="page-title">
                Train the Dog
            </div>
        </header>


        <!-- Game Content -->
        <section class="game-container">

            <!-- Left side -->
            <div class="game-left">
                <button id="home-button" class="home-button" type="button">
                    <img src="assets/home-icon.svg" alt="" class="home-icon">
                    <span>Home</span>
                </button>

                <!-- Stats -->
                <div class="game-stats">

                    <div class="stat">
                        <span class="stat-label">SCORE</span>
                        <span id="score" class="stat-value">0</span>
                    </div>

                    <div class="stat">
                        <span class="stat-label">MOVES</span>
                        <span id="moves" class="stat-value">0</span>
                    </div>

                </div>


                <!-- Grid -->
                <div id="game-grid" class="game-grid">
                    <!-- Grid will be generated by game.js -->
                </div>

            </div>


            <!-- Right side -->
            <aside class="game-controls">

                <!-- Fetch -->
                <button id="fetch-button" class="fetch-button">
                    FETCH
                </button>


                <!-- Reward -->
                <div class="reward-panel">

                    <p class="reward-question">
                        Was that a good move?
                    </p>

                    <div class="reward-buttons">

                        <button id="reward-positive" class="reward-button" disabled>
                            +1
                        </button>

                        <button id="reward-negative" class="reward-button" disabled>
                            -1
                        </button>

                    </div>

                </div>


                <!-- Status -->
                <div id="game-status" class="game-status">
                    The dog is ready
                </div>


                <!-- Reset Controls -->
                <div class="reset-controls">

                    <button id="reset-all">
                        Reset All
                    </button>

                    <button id="reset-environment">
                        Reset Environment
                    </button>

                    <button id="reset-training">
                        Reset Training
                    </button>

                </div>

            </aside>

        </section>

    </main>
    <script src="js/game.js"></script>
</body>

</html>
