<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game | Train the Dog</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="game-page">
    <header class="game-header">
      <div class="logo">AIRIS</div>
      <div class="page-title">Train the Dog</div>
    </header>

    <section class="game-container">
      <div class="game-left">
        <button id="home-button" class="home-button" type="button">
          <img src="assets/home-icon.svg" alt="" class="home-icon">
          Home
        </button>

        <div id="game-grid" class="game-grid" aria-label="Dog training grid"></div>
      </div>

      <aside class="game-controls">
        <div class="game-stats">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span id="score-value" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Moves</span>
            <span id="moves-value" class="stat-value">0</span>
          </div>
        </div>

        <button id="fetch-button" class="fetch-button" type="button">FETCH</button>

        <section class="reward-section">
          <p class="reward-question">Was the suggested move good?</p>
          <div class="reward-buttons">
            <button id="reward-positive" class="reward-button" type="button" disabled>Good</button>
            <button id="reward-negative" class="reward-button" type="button" disabled>Bad</button>
          </div>
        </section>

        <div id="status-message" class="status-message">Start a new training run.</div>

        <div class="reset-section">
          <button id="reset-env" type="button">Reset world</button>
          <button id="reset-train" type="button">Reset learning</button>
          <button id="reset-all" type="button">Reset all</button>
        </div>
      </aside>
    </section>
  </main>

  <div id="congrats-popup" class="congrats-popup" hidden>
    <div class="congrats-dialog">
      <div class="congrats-title">Congratulations</div>
      <div class="congrats-message">The dog brought the bone home.</div>
      <button id="congrats-close" type="button">Continue</button>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/game.js"></script>
</body>

</html>
