<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Train the Dog | AIRIS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-page">

        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                airis
            </div>

            <div class="page-title">
                Train the Dog
            </div>
        </header>


        <!-- Game Content -->
        <section class="game-container">

            <!-- Left side: Home button & Game Grid -->
            <div class="game-left">
                <button id="home-button" class="home-button" type="button">
                    <img src="assets/home-icon.svg" alt="Home" class="home-icon">
                    <span>Home</span>
                </button>

                <!-- Grid -->
                <div id="game-grid" class="game-grid">
                    <!-- Grid will be generated by game.js -->
                </div>
            </div>


            <!-- Right side: Stats & Controls -->
            <aside class="game-controls">

                <!-- Stats -->
                <div class="game-stats">
                    <div class="stat">
                        <span class="stat-label">SCORE</span>
                        <strong id="score" class="stat-value">0</strong>
                    </div>

                    <div class="stat">
                        <span class="stat-label">MOVES</span>
                        <strong id="move-count" class="stat-value">0</strong>
                    </div>
                </div>

                <!-- Fetch -->
                <button id="fetch-button" class="fetch-button">
                    FETCH
                </button>

                <!-- Reward -->
                <div class="reward-section">
                    <p id="reward-prompt" class="reward-question">
                        Was that a good move?
                    </p>

                    <div class="reward-buttons">
                        <button id="positive-reward" class="reward-button" disabled>
                            +1
                        </button>

                        <button id="negative-reward" class="reward-button" disabled>
                            -1
                        </button>
                    </div>
                </div>

                <!-- Status -->
                <div id="status-message" class="status-message">
                    The dog is ready
                </div>

                <!-- Reset Controls -->
                <div class="reset-section">
                    <button id="reset-all">
                        Reset All
                    </button>

                    <button id="reset-environment">
                        Reset Environment
                    </button>

                    <button id="reset-training">
                        Reset Training
                    </button>
                </div>

            </aside>

        </section>

    </main>

    <!-- Reward Popup for +10 -->
    <div id="reward-popup" class="reward-popup" hidden>
        +10
    </div>

    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
